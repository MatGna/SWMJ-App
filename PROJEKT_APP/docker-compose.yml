services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: wynajem-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - wynajem-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -No -Q 'SELECT 1' -h -1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: wynajem-init
    depends_on:
      sql:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - ./db/init:/db-init:ro
      - ./db/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    restart: "no"

volumes:
  wynajem-data:
